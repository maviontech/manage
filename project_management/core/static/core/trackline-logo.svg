<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="tl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="45%" style="stop-color:#4f6ef1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <!-- Track line gradient -->
    <linearGradient id="tl-track" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <!-- Glow filter for the leading dot -->
    <filter id="tl-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Inner shadow for depth -->
    <linearGradient id="tl-sheen" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="44" fill="url(#tl-bg)"/>

  <!-- Subtle top-left sheen overlay -->
  <rect width="200" height="200" rx="44" fill="url(#tl-sheen)"/>

  <!-- Grid lines (subtle, representing tracking grid) -->
  <line x1="40" y1="155" x2="160" y2="155" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="40" y1="125" x2="160" y2="125" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="40" y1="95" x2="160" y2="95" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="40" y1="65" x2="160" y2="65" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Main tracking path — ascending with momentum -->
  <path d="M 38 148 C 55 148, 60 120, 72 115 C 84 110, 88 130, 100 118 C 112 106, 115 80, 130 68 C 142 58, 148 48, 162 38"
        stroke="url(#tl-track)" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Checkpoint dots along the track -->
  <circle cx="38"  cy="148" r="7" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="72"  cy="115" r="7" fill="#ffffff" fill-opacity="0.65"/>
  <circle cx="100" cy="118" r="7" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="130" cy="68"  r="7" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Leading checkpoint (current milestone) — brightest with glow -->
  <circle cx="162" cy="38" r="9" fill="#ffffff" filter="url(#tl-glow)"/>

  <!-- Small check mark inside the leading dot -->
  <polyline points="156,38 160,42 168,34" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
