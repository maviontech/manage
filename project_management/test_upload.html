<!DOCTYPE html>
<html>
<head>
    <title>Test Upload</title>
</head>
<body>
    <h1>Test File Upload</h1>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" multiple>
        <button type="button" onclick="testUpload()">Upload</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        // Get CSRF token from cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        const csrftoken = getCookie('csrftoken');
        
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files.length) {
                resultDiv.innerHTML = '<p style="color: red;">Please select a file</p>';
                return;
            }
            
            const formData = new FormData();
            for (let file of fileInput.files) {
                formData.append('files', file);
            }
            
            resultDiv.innerHTML = '<p>Uploading...</p>';
            
            try {
                // Change task ID to match your test task
                const taskId = 1;
                const response = await fetch(`/tasks/${taskId}/upload-attachment/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrftoken
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<p style="color: green;">Success: ${data.message}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
                }
                
                console.log('Response:', data);
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Exception: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
